[project]
name = "django-thumbnail"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "celery[redis]>=5.6.3",
    "django>=6.0.5",
    "django-bootstrap5>=26.2",
    "django-storages[s3]>=1.14.6",
    "humanize>=4.15.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.41.1",
    "opentelemetry-instrumentation-botocore>=0.62b1",
    "opentelemetry-instrumentation-celery>=0.62b1",
    "opentelemetry-instrumentation-django>=0.62b1",
    "opentelemetry-sdk>=1.41.1",
    "pillow>=12.2.0",
    "psutil>=7.2.2",
    "psycopg[binary]>=3.3.4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "django_thumbnail.settings.test"
pythonpath = ["django_thumbnail"]
python_files = ["test_*.py"]
addopts = ["-ra", "-n", "auto"]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.6",
    "django-stubs>=6.0.4",
    "factory-boy>=3.3.3",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.12",
]
