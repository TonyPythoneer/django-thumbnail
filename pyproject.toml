[project]
name = "django-thumbnail"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.6",
    "celery[redis]>=5.6.3",
    "django>=6.0.5",
    "django-bootstrap5>=26.2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.41.1",
    "opentelemetry-instrumentation-botocore>=0.62b1",
    "opentelemetry-instrumentation-celery>=0.62b1",
    "opentelemetry-instrumentation-django>=0.62b1",
    "opentelemetry-sdk>=1.41.1",
    "pillow>=12.2.0",
    "psycopg[binary]>=3.3.4",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".claude"]

[tool.ruff.lint]
# Keep the set small and deliberate. Each rule earns its place.
#   E, W — pycodestyle (style errors/warnings)
#   F    — pyflakes (undefined names, unused imports)
#   I    — isort (import ordering)
#   UP   — pyupgrade (modern syntax for the pinned Python)
#   B    — flake8-bugbear (likely bugs)
#   SIM  — flake8-simplify (obvious simplifications)
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "django_thumbnail.settings.test"
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = ["-ra", "-n", "auto", "-m", "not smoke"]
markers = [
    "smoke: smoke tests requiring full docker-compose stack (db, redis, minio, celery)",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.6",
    "django-stubs>=6.0.4",
    "factory-boy>=3.3.3",
    "pyrefly>=1.0.0",
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
    "pytest-xdist>=3.8.0",
    "requests>=2.34.1",
    "ruff>=0.15.12",
    "tenacity>=9.1.4",
]
