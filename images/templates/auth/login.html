{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <h2 class="mb-4">Login</h2>
    <form method="post">
      {% csrf_token %}
      {% bootstrap_form form %}
      <button class="btn btn-primary w-100" type="submit">Login</button>
    </form>
    <script>
      document.querySelector('[name=username]').value = 'test1@example.com';
      document.querySelector('[name=password]').value = 'test1';
    </script>
  </div>
</div>
{% endblock %}
