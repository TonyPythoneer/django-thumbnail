{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block title %}Upload Image{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>Upload Image</h2>
      <a href="{% url 'gallery' %}" class="btn btn-outline-secondary btn-sm">← Gallery</a>
    </div>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {% bootstrap_form form %}
      <button class="btn btn-primary w-100 mt-2" type="submit">Upload</button>
    </form>
  </div>
</div>
{% endblock %}
